spring:
  config:
    activate:
      on-profile: local
    import:
      - application-oauth.yml
#      - application-rabbitMQ.yml

  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    url: ${ORACLE_URL}
    username: ${ORACLE_USER}
    password: ${ORACLE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: none
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    properties:
      hibernate:
        format_sql: true
        show-sql: true
        default_batch_fetch_size: 500
    database-platform: org.hibernate.dialect.OracleDialect
  cache:
    type: redis
  data:
    redis:
      port: 6379
      host: redis-dplanner
      password:
      repositories:
        enabled: false

expire:
  defaultTime: 60

cloud:
  aws:
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_S3_ACCESSKEY}
      secret-key: ${AWS_S3_SECRETKEY}

    s3:
      bucket : dplanner-resource-server

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.orm.jdbc.bind: trace
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %clr(%5level) [%15.15t] [%X{request_id}] %clr(%-40.40logger{39}){cyan} : %m%n%wEx"

server:
  port: 8080
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}
  client-secret: ${KAKAO_CLIENT_SECRET:}
  # 앱 로그인 토큰이 우리 카카오 앱에서 발급됐는지 확인 (카카오 개발자 콘솔 > 앱 ID, 쉼표 구분)
  app-ids: ${KAKAO_APP_IDS:1092659}

# 앱 소셜 로그인 토큰 검증 (/auth/login)
auth:
  apple:
    client-ids: ${APPLE_CLIENT_IDS:com.dancepozz.dplanner}
  google:
    # ID 토큰 aud: Android·웹 = 웹 클라이언트, iOS = iOS 클라이언트
    client-ids: ${GOOGLE_CLIENT_IDS:547095373091-d663tdou7mhivsltgtfoesrti7j98knl.apps.googleusercontent.com,547095373091-g01u6sh5re5g09cuu4c7b7hb54k4d46d.apps.googleusercontent.com}
  legacy-login:
    # 옛 앱(email+name 만 보냄) 허용. 새 앱 보급 후 false
    enabled: ${AUTH_LEGACY_LOGIN_ENABLED:true}
